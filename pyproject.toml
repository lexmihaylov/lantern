[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-lan-monitor"
version = "0.1.0"
description = "A terminal-based IPv4 LAN device monitor for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lantern contributors" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.scripts]
lantern = "lantern.libs.cli:main_entry"

[tool.setuptools]
packages = ["lantern", "lantern.libs"]
package-dir = { lantern = ".", "lantern.libs" = "libs" }

